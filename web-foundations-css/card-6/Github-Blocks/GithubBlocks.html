<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Blocks</title>
    <link rel="stylesheet" href="GithubBlocks.css" />
  </head>
  <body>
    <div class="container">
      <h1>GitHub Blocks</h1>

      <section class="panel panel--teal">
        <div class="row row--space-between">
          <img
            class="octocat"
            src="https://octodex.github.com/images/securitocat.png"
            alt="octocat 1"
          />
          <img
            class="octocat"
            src="https://octodex.github.com/images/sponsortocat.png"
            alt="octocat 2"
          />
          <img
            class="octocat"
            src="https://octodex.github.com/images/sponsortocat.png"
            alt="octocat 3"
          />
        </div>
      </section>

      <section class="panel panel--purple">
        <div class="row row--center">
          <img
            class="octocat"
            src="https://octodex.github.com/images/sponsortocat.png"
            alt="octocat 4"
          />
          <img
            class="octocat"
            src="https://octodex.github.com/images/securityknightocat.png"
            alt="octocat 5"
          />
        </div>
      </section>

      <section class="panel panel--white">
        <div class="row row--space-around">
          <img
            class="octocat"
            src="https://octodex.github.com/images/mona-the-rivetertocat.png"
            alt="octocat 6"
          />
          <img
            class="octocat"
            src="https://octodex.github.com/images/yogitocat.png"
            alt="octocat 7"
          />
          <img
            class="octocat"
            src="https://octodex.github.com/images/godotocat.png"
            alt="octocat 8"
          />
        </div>
      </section>

      <div class="footer">
        Images from
        <a href="https://octodex.github.com" target="_blank" rel="noopener"
          >GitHub Octodex</a
        >
      </div>
    </div>
  </body>
</html>
