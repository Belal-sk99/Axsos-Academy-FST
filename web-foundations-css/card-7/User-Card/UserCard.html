<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="UserCard.css" />
    <title>User Card</title>
  </head>
  <body class="flex-col flex-center w-100vh">
    <div class="card flex-col">
      <div class="flex-1 bg-lightBlue"></div>
      <div class="info-section relative flex-col flex-3 gap-1 items-start px-1">
        <figure class="profile-placeholder absolute flex-center">
          <img
            src="./assets/user-circle.png"
            alt="profile picture"
            width="90%"
            height="90%"
          />
        </figure>
        <h2 class="name">Jane Doe</h2>
        <div class="flex-center gap-1">
          <img
            src="./assets/map-marker.png"
            alt="location icon"
            width="10px"
            height="16px"
          />
          <h3>Seattle</h3>
        </div>
        <div class="flex-col">
          <p>Developer | Engineer | Problem Solver</p>
          <p>Master of Shadows and the Internet!</p>
        </div>
        <div class="flex-center gap-1">
          <img
            src="./assets/gear.png"
            alt="gear icon"
            width="16px"
            height="16px"
          />
          <a href="#"> edit profile</a>
        </div>
      </div>
    </div>
  </body>
</html>
